name: CI

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Portable host tests (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config
      - run: make CFLAGS_CPU= test-host -j2

  native:
    name: Native tests and GPU build (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native and GPU/media build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config libpng-dev libjpeg-dev
          libgles2-mesa-dev libgbm-dev libegl1-mesa-dev
          libavcodec-dev libavformat-dev libswscale-dev libavutil-dev
      - name: Run native tests and compile both libraries
        run: make CFLAGS_CPU= all test -j2
      - name: Test runtime CLI offscreen (no EGL or GPIO)
        run: make CFLAGS_CPU= test-runtime-cli

  sanitizers:
    name: Native ASan and UBSan (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libpng-dev libjpeg-dev
      - name: Run native tests with memory and undefined-behavior checks
        run: >-
          make CFLAGS_CPU= BUILD=debug
          EXTRA_CFLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          LDFLAGS='-fsanitize=address,undefined' test -j2

  python:
    name: Python ${{ matrix.python }} (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    env:
      HUB75_BACKEND: cpu
      HUB75_CFLAGS_CPU: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libpng-dev libjpeg-dev
      - run: python -m pip install --upgrade pip build setuptools wheel mypy numpy Pillow
      - run: python -m pip install ./python
      - name: Run installed Python API tests (no GPIO)
        run: python -X faulthandler -m unittest discover -s python/tests -v
      - name: CLI smoke test
        run: python -m hub75gpu --seconds .1
      - name: Type-check implementation and stubs
        if: matrix.python == '3.13'
        run: |
          mypy python/hub75gpu/__init__.py python/hub75gpu/__main__.py --follow-imports=skip --ignore-missing-imports
          mypy python/hub75gpu/__init__.pyi python/hub75gpu/__main__.py --ignore-missing-imports
      - name: Short offscreen resource soak
        run: python python/benchmarks/soak.py --seconds 2
      - name: Build and test wheel and sdist in fresh environments
        if: matrix.python == '3.13'
        run: python python/tests/clean_install.py

  required:
    # Keep this name stable: select it as the required status check for main.
    name: CI required
    if: ${{ always() }}
    needs: [host, native, sanitizers, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every test job to succeed (including all matrix entries)
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ['JOB_RESULTS'])
          failed = {job: info['result'] for job, info in results.items()
                    if info['result'] != 'success'}
          if failed:
              print(f'Required CI jobs did not succeed: {failed}', file=sys.stderr)
              sys.exit(1)
          print('All required CI jobs passed.')
          PY

# Hosted ARM64 runners exercise ARM SIMD without Pi devices. No job activates
# GPIO, requires sudo at test runtime, or changes IRQ/CPU/boot configuration.
# Electrical timing, actual EGL rendering and panel acceptance are separate gates.
